name: Deploy to Fly.io

# Каждый push в main автоматически обновляет бота на Fly.io.
# Требуется секрет репозитория FLY_API_TOKEN (см. README, раздел про Fly.io).
# Пока токен не добавлен и приложение не создано — этот workflow будет
# показывать красный крестик, это нормально до первого ручного `fly deploy`.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy bot
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
